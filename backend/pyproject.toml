[project]
name = "bec-guard-api"
version = "0.1.0"
description = "BEC Guard academic project: initial API scaffold"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic[email]>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1",
    "alembic>=1.16,<2",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-google-genai>=4,<5",
    "langchain-groq>=1,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1,<3",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an isolated PostgreSQL database via TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
